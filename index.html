<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embedded Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button type="button" class="icon-btn" id="copy-link" aria-label="埋め込み用リンクをコピー" title="埋め込み用リンクをコピー">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </svg>
  </button>
  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-message"></span>
    <input class="toast-url" id="toast-url" type="text" readonly hidden aria-label="埋め込み用リンク">
  </div>
  <main class="timer" id="timer" data-state="idle">
    <p class="label" id="label" hidden></p>
    <input
      class="display"
      id="display"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      spellcheck="false"
      aria-label="残り時間 (停止中はクリックして編集)"
      value="05:00"
    >
    <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress"></div></div>
    <div class="presets" id="presets"></div>
    <div class="controls">
      <button type="button" class="btn primary" id="toggle">開始</button>
      <button type="button" class="btn" id="reset">リセット</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
